name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lockfile dedupe
        run: pnpm dedupe --check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

      - name: Tenant leak tests
        run: pnpm test:tenant-leak

      - name: Install Playwright browser
        run: pnpm --filter @omnivo/app exec playwright install --with-deps chromium

      # The ERP app only: the storefront's tests have their own step below
      - name: E2E (Playwright on MSW mocks)
        run: pnpm test:e2e --filter=@omnivo/app

      - name: E2E (service worker on a production build)
        run: pnpm test:e2e:pwa

      # Step 26e: the storefront on its built server, with the mock source (apps/shop/e2e). The
      # browser from the step above serves it too: the lockfile has one @playwright/test for both apps
      - name: E2E (storefront on its built server)
        run: pnpm --filter @omnivo/shop test:e2e

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm test:bundle-size

      - name: OpenAPI spec up to date
        run: pnpm test:openapi

      - name: Module boundaries
        run: pnpm boundaries

  # Every push to dev that passes the gate goes to the demo (demo.omnivosoft.com), with its own
  # database. The users never see it.
  deploy-demo:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy.yml
    with:
      target: demo
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # Every push to main (a merged pull request from dev) that passes the gate goes to production
  # (app.omnivosoft.com). The users' open tabs show the update notice and get it on reload.
  # Pull requests never deploy.
  deploy-production:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
    permissions:
      contents: read
      packages: write
    secrets: inherit
